title: "Causality and Machine Learning"
subtitle: "NORA Summer School"
description: "Course website"

url: "https://johandh2o.github.io"
baseurl: "/causal-inference-summer-school"
repository: "johandh2o/causal-inference-summer-school"

theme: jekyll-theme-primer
markdown: kramdown

kramdown:
  input: GFM
  math_engine: mathjax

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

course:
  day: 3
  title: "Causality and Machine Learning"
  language: "Python"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .DS_Store
  - README_local.md
